{% extends "base.html" %}

{% block title %}登录 - 留言板{% endblock %}

{% block content %}

<div class="login-box">
    <h2>登录</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
        <input type="text" name="username" placeholder="用户名" maxlength="20" required autofocus>
        <input type="password" name="password" placeholder="密码" required>
        <button type="submit">登录</button>
    </form>

    <p class="hint">
        还没有账号？<a href="{{ url_for('register') }}">立即注册</a>
    </p>
    <p class="hint">
        <a href="{{ url_for('index') }}">← 返回留言板</a>
    </p>
</div>

{% endblock %}
