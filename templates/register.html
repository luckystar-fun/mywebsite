{% extends "base.html" %}

{% block title %}注册 - 留言板{% endblock %}

{% block content %}

<div class="login-box">
    <h2>注册新账号</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('register') }}">
        <input type="text" name="username" placeholder="用户名（2~20 个字符）" maxlength="20" required autofocus>
        <input type="password" name="password" placeholder="密码（至少 6 位）" required>
        <input type="password" name="password2" placeholder="再输一次密码" required>
        <button type="submit">注册</button>
    </form>

    <p class="hint">
        已有账号？<a href="{{ url_for('login') }}">去登录</a>
    </p>
    <p class="hint">
        <a href="{{ url_for('index') }}">← 返回留言板</a>
    </p>
</div>

{% endblock %}
